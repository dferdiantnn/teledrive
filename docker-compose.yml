services:
  teldrive:
    build: .
    container_name: teldrive
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TELDRIVE_DB_DATA_SOURCE=postgres://teldrive:teldrive_secret_pass@postgres:5432/teldrive?sslmode=disable
      - TELDRIVE_JWT_SECRET=change_this_to_random_secret_string_32chars
      - TELDRIVE_JWT_ALLOWED_USERS=your_telegram_username
      - TELDRIVE_TG_UPLOADS_ENCRYPTION_KEY=change_this_to_random_encryption_key
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: teldrive_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teldrive
      POSTGRES_PASSWORD: teldrive_secret_pass
      POSTGRES_DB: teldrive
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teldrive -d teldrive"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
