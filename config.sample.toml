[db]
data-source = "postgres://postgres:password@localhost:5432/teldrive?sslmode=disable"
prepare-stmt = false

[db.pool]
enable = true
max-open-connections = 25
max-idle-connections = 25

[jwt]
# Masukkan username Telegram kamu tanpa tanda @ (bisa lebih dari satu)
allowed-users = ["your_telegram_username"]
# String acak untuk JWT Secret
secret = "generate_random_secret_string_here_32_chars"

[tg.uploads]
# Kunci enkripsi untuk mengamankan file (opsional tapi sangat disarankan)
encryption-key = "generate_random_encryption_key_here"

[server]
port = 8080
